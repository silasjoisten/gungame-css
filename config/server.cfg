// ===========================================================================
//  GunGame Deathmatch server config  (executed automatically on server start)
// ===========================================================================

hostname "sijolas Deathmatch GunGame"
sv_contact ""
rcon_password ""              // set a password if you run a dedicated server
sv_password ""                // set to require a join password

// --- Network / downloads --------------------------------------------------
sv_lan 0                      // 1 = LAN only, 0 = allow internet clients
sv_pure 0                     // 0 = allow GunGame's custom sounds to play
sv_allowdownload 1
sv_allowupload 1

// --- Deathmatch feel (NOT round based) ------------------------------------
mp_freezetime 0               // no freeze at round start
mp_roundtime 9                // long rounds; respawning keeps play continuous
mp_ignore_round_win_conditions 1  // DEATHMATCH: never restart the round on a team wipe / elimination
mp_maxrounds 0                // no round limit
mp_winlimit 0
mp_fraglimit 0
mp_autoteambalance 0          // do NOT shuffle players between teams
mp_limitteams 0               // no team-size limit (players can ALWAYS join our team)
mp_friendlyfire 0             // team vs team, no friendly fire
mp_tkpunish 0
mp_autokick 0                 // don't auto-kick (GunGame handles AFK)
mp_flashlight 1
mp_footsteps 1
sv_alltalk 0
mp_timelimit 30               // map rotates / nextmap fires after 30 min

// --- Deathmatch respawn (dm_respawn plugin) -------------------------------
// NOTE: SourceMod plugin cvars are NOT set here (server.cfg runs before the
// plugins load). Tune them in their own files instead:
//   Respawn   -> cfg/sourcemod/dm_respawn.cfg        (sm_dm_respawntime, ...)
//   Bot count -> cfg/sourcemod/bot_balance.cfg       (sm_botbalance_extra)
//   Win->map  -> cfg/sourcemod/gg_winner_mapchange.cfg

// --- Teams & bots: humans = CT (our team), bots = T (enemy) ONLY ----------
mp_humanteam "CT"             // all human players go to CT (our team)
bot_join_team "T"             // all bots go to T (enemy team) - never our team
bot_quota_mode normal         // bot_quota = exact number of bots
bot_quota 2                   // initial value; bot_balance plugin manages it live (humans + 2)
bot_join_after_player 0       // bots present from the start
bot_difficulty 1              // 0=easy 1=normal 2=tough 3=expert
bot_chatter off

// --- Map voting -----------------------------------------------------------
// Rock The Vote: players type  rtv  (or  !rtv ) in chat to start a map vote.
// nextmap + mapchooser read the map list from  mapcycle.txt  (in cstrike/).
mapcyclefile "mapcycle.txt"

exec banned_user.cfg
exec banned_ip.cfg
